# Put the CLI tools installed by these dotfiles on PATH for systemd user
# services such as t3code.service, which do not read shell startup files.
# Keep the order in sync with the PATH set in dot_zshrc.tmpl.
PNPM_HOME=${XDG_DATA_HOME:-${HOME}/.local/share}/pnpm
AQUA_GLOBAL_CONFIG=${HOME}/aqua.yaml
PATH=${HOME}/.cargo/bin:${PNPM_HOME}/bin:${XDG_DATA_HOME:-${HOME}/.local/share}/aquaproj-aqua/bin:${HOME}/.local/bin:${PATH}
