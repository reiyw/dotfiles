name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  install-ubuntu:
    strategy:
      matrix:
        image:
          # For the full list of images, see:
          # https://hub.docker.com/_/microsoft-vscode-devcontainers
          - mcr.microsoft.com/vscode/devcontainers/base:debian-12
          - mcr.microsoft.com/vscode/devcontainers/base:debian-13
          - mcr.microsoft.com/vscode/devcontainers/base:ubuntu-22.04
          - mcr.microsoft.com/vscode/devcontainers/base:ubuntu-24.04
          # Minimal images without curl, git, or CA certificates.
          - debian:12
          - debian:13
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install bootstrap packages
        if: startsWith(matrix.image, 'debian:')
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git
      - uses: actions/checkout@v7
      - run: ./install.sh
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.AQUA_GITHUB_TOKEN }}
      - name: chezmoi doctor
        run: |
          git config --global --add safe.directory /__w/dotfiles/dotfiles
          mkdir -p /__w/dotfiles/.tmp
          export TMPDIR=/__w/dotfiles/.tmp
          "$HOME/.local/bin/chezmoi" doctor
  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.AQUA_GITHUB_TOKEN }}
      - name: chezmoi doctor
        run: '"$HOME/.local/bin/chezmoi" doctor'
